cli-output: "== an empty folder and a key: encrypted, encryption.json written\nexit 0 \n{\"algorithm\":\"XChaCha20-Poly1305\",\"key_id\":\"e395e1f8\",\"version\":1}\n== no key and no --notencrypt: refused\nexit 1 set EMISSARIO_ENCRYPT_KEY to the key the databases are encrypted with (generate one with `emissario generate-encrypt-key`, and keep it safe: losing it loses every database and every backup), or pass --notencrypt to keep them in clear for local debugging\nexit status 1\n== the key and --notencrypt: refused\nexit 1 EMISSARIO_ENCRYPT_KEY is set and --notencrypt was passed: choose one — the key to encrypt the databases, or --notencrypt to keep them in clear for debugging\nexit status 1\n== an encrypted folder and its key: runs\nexit 0 \n== an encrypted folder and another key: refused\nexit 1 EMISSARIO_ENCRYPT_KEY does not match the databases under data: they were encrypted with another key (key_id e395e1f8, this one is 1d72ee5d)\nexit status 1\n== an encrypted folder and --notencrypt: refused\nexit 1 the databases under data are encrypted: they cannot be opened without their key; set EMISSARIO_ENCRYPT_KEY instead of passing --notencrypt\nexit status 1\n== a passphrase: refused, never quoted\nexit 1 EMISSARIO_ENCRYPT_KEY is not a key: it must be 32 random bytes in base64 or hex, never a passphrase; generate one with `emissario generate-encrypt-key`\nexit status 1\n== an empty folder and --notencrypt: in clear, with a warning\nexit 0 warning: --notencrypt: the databases under clear are not encrypted — debug only. Every IP, email, contact request, summary, the access log and the key that hashes the IPs sit in clear on the disk and in every backup; never run a website this way.\n== a folder in clear and a key: refused\nexit 1 the databases under clear are not encrypted: they were created with --notencrypt, or by an earlier version; start a new folder (--database) to encrypt them, a folder in clear is never encrypted in place\nexit status 1\n== help, version and generate-encrypt-key open no database\nversion runs without a key\n45\n== nothing in clear under data/\nno email found in data/\ne1e395e1f8\n"
