args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: start-server
category: Middleware
description: Runs in front of start-server and answers nothing. It reads --fonts into sandbox.Config.FontsDir, the folder every git source is cloned into - the website source, set by a root in the backoffice at /admin/root/set-website-source, is cloned into <fonts>/frontend and the public website is served from that checkout, / answering its index.html. It then starts the goroutine that clones the repository and pulls its branch every sync time, and runs a sync whenever the Sync button or POST /api/admin/root/sync-website-source asks for one; with no sync time set it syncs only when asked. git runs with the credentials of the user running the server (ssh keys, a credential helper) and never prompts for one.
flags:
    - default: EmissarioFonts
      description: the folder the git sources are cloned into, one folder per source named after it, relative to where the server runs (defaults to EmissarioFonts)
      id: Fonts
priority: 51
strict: false
summary: Read --fonts and start syncing the website source in front of start-server
