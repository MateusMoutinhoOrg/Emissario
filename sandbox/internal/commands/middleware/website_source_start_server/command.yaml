args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: start-server
category: Middleware
description: 'Runs in front of start-server and answers nothing. It reads --fonts into sandbox.Config.FontsDir - the folder every source is cloned into, one folder per source named after it: the website source into <fonts>/frontend, the agent source into <fonts>/agent - and starts one goroutine per source that clones its repository and pulls its branch every sync time, and runs a sync whenever the Sync button or POST /api/admin/root/sync-website-source (or sync-agent-source) asks for one. A root sets each source at /admin/root/set-website-source and /admin/root/set-agent-source. git runs with the credentials of the user running the server; none is asked for or stored.'
flags:
    - default: EmissarioFonts
      description: the folder the git sources are cloned into, one folder per source named after it, relative to where the server runs (defaults to EmissarioFonts)
      id: Fonts
priority: 51
strict: false
summary: Read --fonts and start syncing the website source and the agent source in front of start-server
