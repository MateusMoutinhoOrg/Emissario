args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: start-server
category: Middleware
description: Runs in front of start-server and answers nothing. It reads --fonts into sandbox.Config.FontsDir, the folder every git source is cloned into - the frontend source, set by a root in the backoffice at /admin/root/set-git-source, is cloned into <fonts>/frontend and the public website is served from that checkout, / answering its index.html. It then starts the goroutine that clones the repository and pulls its branch every sync time; with no sync time set it does nothing. git runs with the credentials of the user running the server (ssh keys, a credential helper) and never prompts for one.
flags:
    - default: EmissarioFonts
      description: the folder the git sources are cloned into, one folder per source named after it, relative to where the server runs (defaults to EmissarioFonts)
      id: Fonts
priority: 51
strict: false
summary: Read --fonts and start syncing the git sources in front of start-server
