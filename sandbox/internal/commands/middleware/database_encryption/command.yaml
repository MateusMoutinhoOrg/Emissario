args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        negate: true
        type: one-of
        values:
            - help
            - version
            - generate-encrypt-key
            - rotate-encrypt-key
            - drop-front-skills
            - drop-agents-skills
category: Middleware
description: 'Runs in front of every command line that may open a database, and answers none of them. It reads the key every database is encrypted with from the EMISSARIO_ENCRYPT_KEY environment variable — 32 random bytes in base64 or hex, which `emissario generate-encrypt-key` prints — removes it from the process environment, so git and its hooks never inherit it, and checks it against <database>/encryption.json before any record is read. Every database is then encrypted by Keep itself, its Props.EncryptKey derived from that key: AES-256-GCM over every value, and every index entry named by a digest keyed by it. A new database folder is encrypted with that key and gets its encryption.json; a folder encrypted with another key, a key missing, a folder in clear, or one whose key rotation did not finish the command refuses, with exit 1. --notencrypt opens a folder in clear instead, for local debugging only: it warns at every start, and every backoffice page says so. help, version, generate-encrypt-key, drop-front-skills and drop-agents-skills open no database and skip it; rotate-encrypt-key reads both keys itself.'
flags:
    - description: 'open the databases in clear, without EMISSARIO_ENCRYPT_KEY: for local debugging only, never in production'
      id: Notencrypt
      type: boolean
priority: 7
strict: false
summary: Open every database encrypted with EMISSARIO_ENCRYPT_KEY, or in clear with --notencrypt
