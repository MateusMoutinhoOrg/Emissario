args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: start-server
category: Middleware
description: 'Runs in front of start-server and answers nothing. It adds the privacy settings with a new random IP key on a new database, starts the writer of the access log — which keeps every page view and every call to the public APIs with the full IP, the source port and the time in UTC once a root turns it on at /admin/root/set-privacy-settings — and the hourly cleanup that deletes what is past its retention. Behind one reverse proxy (--allow-x-forwarded-for), the port the server sees is the proxy''s own: --client-port-header names the header the proxy sets the visitor''s port in, trusted under the same rule as X-Forwarded-For (nginx: proxy_set_header X-Client-Port $remote_port).'
flags:
    - description: 'the header the reverse proxy in front sets to the source port of the visitor''s connection (X-Client-Port, with nginx: proxy_set_header X-Client-Port $remote_port), which the access log keeps; read only with --allow-x-forwarded-for'
      id: ClientPortHeader
priority: 55
strict: false
summary: Start the access log writer and the privacy cleanup in front of start-server
