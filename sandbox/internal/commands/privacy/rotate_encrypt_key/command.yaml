args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: rotate-encrypt-key
category: Privacy
description: 'Reseals every database under --database, and every file every snapshot keeps, from the key in the variable --old-key-env names to the one in EMISSARIO_ENCRYPT_KEY: the path after a key leaked. There is no migration from a folder in clear. It takes a snapshot first, works file by file and writes encryption.json last, so a rotation interrupted is run again with both keys and reseals only what is left. Run it with the server stopped. Snapshots stay restorable with the new key; archives downloaded before stay sealed under the old one.'
examples:
    - EMISSARIO_OLD_ENCRYPT_KEY=$OLD EMISSARIO_ENCRYPT_KEY=$(emissario generate-encrypt-key) emissario rotate-encrypt-key --old-key-env EMISSARIO_OLD_ENCRYPT_KEY
flags:
    - description: the environment variable holding the key the databases are encrypted with now, the one to rotate away from (EMISSARIO_OLD_ENCRYPT_KEY, say)
      id: OldKeyEnv
      required: true
priority: 100
summary: Re-encrypt every database and backup from an old key to the one in EMISSARIO_ENCRYPT_KEY
