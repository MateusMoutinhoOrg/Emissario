args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: drop-agents-skills
category: Skills
description: 'Writes the emissario-agent skill into the agent instructions repository at --path, once for each coding agent: .claude/skills/ (Claude Code), .agents/skills/ (Codex) and .agent/skills/ (Antigravity). The skill holds what the repository needs to know of the agent and nothing else: instructions/README.md read first at every message, instructions/SUMMARY.md for the summaries, every other file of instructions/ read on demand through the tools of the model, the limits, and the mandatory rules that come before the instructions. A run removes the emissario-agent folder of each agent and writes it again, so a second run changes nothing and a new version leaves no stale file; nothing else of the repository is touched. It opens no database.'
examples:
    - drop-agents-skills --path .
    - drop-agents-skills --path ../my-agent
flags:
    - default: .
      description: the agent instructions repository to write the skills into (defaults to the current directory)
      id: Path
priority: 100
summary: Write the skills that teach a coding agent to write the instructions of the agent of emissario
