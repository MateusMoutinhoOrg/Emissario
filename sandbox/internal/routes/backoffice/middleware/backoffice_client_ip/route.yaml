category: Middleware
methods:
    - ANY
parameters:
    - description: the ip of the connection, set by the server and never by the client
      id: XClientIp
      key: x-client-ip
      sources:
        - header
      type: string
    - description: the client chain a reverse proxy appended to, read only with --allow-x-forwarded-for
      id: XForwardedFor
      key: x-forwarded-for
      sources:
        - header
      type: string
    - description: the source port of the visitor's connection, set by the server and never by the client — or by the reverse proxy start-server trusts with --client-port-header
      id: XClientPort
      key: x-client-port
      sources:
        - header
      type: string
paths:
    - end: -1
      id: Root
      start: 0
      trigger:
        type: prefix
        value: /
priority: 7
response-type: text/plain
summary: Works out the client ip every route after it reads, from the connection or the reverse proxy in front
