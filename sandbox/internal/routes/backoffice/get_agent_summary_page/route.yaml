category: Agent
description: Root and viewer; a root also sees the buttons that delete and hold it, and the end of the legal hold that keeps it. An id no summary holds answers 404.
examples:
    - curl -b "backoffice_session=$SESSION" "localhost:3000/admin/get-agent-summary?id=3f9a0c1b2d4e5f60"
methods:
    - GET
parameters:
    - description: the id of the summary, as /api/agent/summaries answered it
      id: Id
      key: id
      sources:
        - query
      type: string
    - description: the outcome code of the last hold
      id: Notice
      key: notice
      sources:
        - query
      type: string
    - default: "0"
      description: how many summaries the last hold kept
      id: Count
      key: count
      sources:
        - query
      type: integer
    - description: why the last hold was refused
      id: Reason
      key: reason
      sources:
        - query
      type: string
paths:
    - end: -1
      id: AdminGetAgentSummary
      start: 0
      trigger:
        type: equal
        value: /admin/get-agent-summary
priority: 100
private: true
response-type: text/html
summary: Shows one summary whole
