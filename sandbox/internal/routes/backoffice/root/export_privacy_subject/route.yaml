category: Privacy
description: 'Root only. Every record of the person of ip and text as a JSON download, as find-privacy-subject answers it: what an access or a portability request asks for (LGPD art. 18 II, V; GDPR arts. 15, 20).'
methods:
    - GET
parameters:
    - description: 'the ip of the person: one address, or a hash h:…'
      id: Ip
      key: ip
      sources:
        - query
      type: string
    - description: 'a text the person sent: an email, a phone, a name'
      id: Text
      key: text
      sources:
        - query
      type: string
paths:
    - end: -1
      id: AdminRootExportPrivacySubject
      start: 0
      trigger:
        type: equal
        value: /admin/root/export-privacy-subject
priority: 100
private: true
response-type: application/json
summary: Downloads every record of a person as JSON
