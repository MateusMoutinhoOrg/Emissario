body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            acknowledge:
                items:
                    type: string
                type: array
            also-access-log:
                maxLength: 8
                type: string
            ip:
                maxLength: 128
                type: string
            text:
                maxLength: 200
                type: string
        type: object
    max-bytes: 16384
    required: true
    type: form
category: Privacy
description: Root only. Deletes every record of the person of ip and text but the held ones and, unless also-access-log=1, the access log rows; deleting access log rows answers the page under a 409 with the erase-kept-v1 notice every time, until acknowledge=erase-kept-v1. The ids deleted of contact-request, visualization-view, agent-usage and agent-summary are kept in privacy-erasure — no personal data, no user — so a restore deletes them again; deleting access log rows keeps nothing. Answers 303 back to the search with notice=erased&count=<deleted>&kept=<kept>.
methods:
    - POST
paths:
    - end: -1
      id: AdminRootErasePrivacySubject
      start: 0
      trigger:
        type: equal
        value: /admin/root/erase-privacy-subject
priority: 100
private: true
response-type: text/html
summary: Deletes every record of a person but those the law or a hold keeps
