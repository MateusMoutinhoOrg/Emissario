category: Visualization
description: Root only. The views of the filters of the dashboard as text/csv, downloaded as visualization-views-<from>-<to>.csv, the time in the server's time zone; a cell a spreadsheet would run as a formula is led by a quote mark.
examples:
    - curl -b "backoffice_session=$SESSION" -o views.csv 'localhost:3000/admin/root/export-visualization-views?from=2026-10-01&to=2026-10-13'
methods:
    - GET
parameters:
    - description: the first day of the period, YYYY-MM-DD, included; 6 days before to when absent
      id: From
      key: from
      sources:
        - query
      type: string
    - description: the last day of the period, YYYY-MM-DD, included; today when absent; a period covers 366 days at most
      id: To
      key: to
      sources:
        - query
      type: string
    - description: one canonical page, exactly (/blog/)
      id: Path
      key: path
      sources:
        - query
      type: string
    - description: keeps the pages starting with it (/blog/)
      id: Prefix
      key: prefix
      sources:
        - query
      type: string
    - description: 'one ip or one CIDR range (203.0.113.0/24): a root only, a viewer is answered 403'
      id: Ip
      key: ip
      sources:
        - query
      type: string
    - description: one ISO 3166-1 alpha-2 code (BR), XX for an unknown country
      id: Country
      key: country
      sources:
        - query
      type: string
    - description: desktop, mobile, tablet, bot or other
      id: Device
      key: device
      sources:
        - query
      type: string
    - description: Chrome, Firefox, Safari, Edge, Opera, Samsung Internet or Other
      id: Browser
      key: browser
      sources:
        - query
      type: string
    - description: Windows, macOS, Linux, Android, iOS, ChromeOS or Other
      id: Os
      key: os
      sources:
        - query
      type: string
    - description: 200, or 404 for the not-found views
      id: Status
      key: status
      sources:
        - query
      type: string
    - description: 1 includes the views of bots, left out of everything otherwise
      id: Bots
      key: bots
      sources:
        - query
      type: string
paths:
    - end: -1
      id: AdminRootExportVisualizationViews
      start: 0
      trigger:
        type: equal
        value: /admin/root/export-visualization-views
priority: 100
private: true
response-type: text/csv
summary: Downloads the page views of a period as CSV, newest first, 100 000 at most
