body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            id:
                minimum: 1
                type: integer
        required:
            - id
        type: object
    max-bytes: 4096
    required: true
    type: form
category: Backoffice Users
description: 'Root only. id is the user''s. Their secret is forgotten and two-factor sign-in turned off: they sign in with their password alone until they set it up again on /admin/set-totp. Redirects to the user list.'
methods:
    - POST
paths:
    - end: -1
      id: AdminRootResetBackofficeTotp
      start: 0
      trigger:
        type: equal
        value: /admin/root/reset-backoffice-totp
priority: 100
private: true
response-type: text/html
summary: Resets the two-factor sign-in of a backoffice user
