body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            acknowledge:
                items:
                    type: string
                type: array
            from:
                maxLength: 128
                type: string
            ids:
                items:
                    type: integer
                type: array
            ip:
                maxLength: 128
                type: string
            kind:
                maxLength: 128
                type: string
            to:
                maxLength: 128
                type: string
        type: object
    max-bytes: 262144
    required: true
    type: form
category: Privacy
description: 'Root readers only. ids are the access log rows to delete. A row younger than the access log retention is kept under a legal obligation in Brazil (Marco Civil art. 15): deleting one asks for the erase-kept-v1 notice at every use, sent back in acknowledge. A row on a legal hold is never deleted. Nothing records the deletion. ip, from, to and kind redraw the page the form came from.'
methods:
    - POST
paths:
    - end: -1
      id: AdminRootDeleteAccessLog
      start: 0
      trigger:
        type: equal
        value: /admin/root/delete-access-log
priority: 100
private: true
response-type: text/html
summary: Deletes access log rows, to its readers
