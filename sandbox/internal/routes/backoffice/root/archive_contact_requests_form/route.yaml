body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            archived:
                maxLength: 8
                type: string
            back:
                maxLength: 2048
                type: string
            ids:
                items:
                    maxLength: 64
                    type: string
                maxItems: 100
                type: array
        type: object
    max-bytes: 16384
    required: true
    type: form
category: Contact Requests
description: 'Root only. Send ids — the ids of the contact requests, at most 100 — and archived: 1 archives them, 0 moves them back to the inbox; back is the page to answer 303 to, with ?notice=archived|unarchived&count=<n>. Ids no contact request holds are left out; when none is found, the list answers under a 404.'
examples:
    - 'curl -b "backoffice_session=$SESSION" -X POST localhost:3000/admin/root/archive-contact-requests -H ''Origin: http://localhost:3000'' --data ''ids=3f9a0c1b2d4e5f60&archived=1'''
methods:
    - POST
paths:
    - end: -1
      id: AdminRootArchiveContactRequests
      start: 0
      trigger:
        type: equal
        value: /admin/root/archive-contact-requests
priority: 100
private: true
response-type: text/html
summary: Archives the contact requests selected, or moves them back to the inbox
