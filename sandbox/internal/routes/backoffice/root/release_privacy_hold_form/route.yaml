body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            id:
                minimum: 1
                type: integer
        required:
            - id
        type: object
    max-bytes: 4096
    required: true
    type: form
category: Privacy
description: 'Root only, and a reader of the access log to release a hold of its rows. id is the hold''s. Released, it is deleted and its rows follow their retention again: one past it is deleted at the next cleanup. Redirects to the Privacy page.'
methods:
    - POST
paths:
    - end: -1
      id: AdminRootReleasePrivacyHold
      start: 0
      trigger:
        type: equal
        value: /admin/root/release-privacy-hold
priority: 100
private: true
response-type: text/html
summary: Releases a legal hold
