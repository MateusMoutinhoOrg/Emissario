body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            include-backoffice:
                type: boolean
        type: object
    max-bytes: 4096
    type: form
category: Backoffice Backups
description: 'Root only. backofficedb and privacydb are kept as they are unless include-backoffice=true: the backoffice users, sessions and tokens, and the privacy settings, the access log, its inventory, the legal holds and the erasures. Answers 303 back to the list; every request is answered 503 while the restore runs.'
methods:
    - POST
paths:
    - end: 2
      id: AdminRootRestoreBackup
      start: 0
      trigger:
        type: equal
        value: /admin/root/restore-backup
    - end: 3
      id: Id
      start: 3
      type: integer
priority: 100
private: true
response-type: text/html
segments: 4
summary: Starts putting a snapshot back over every database, after a pre-restore snapshot of them, and answers at once
