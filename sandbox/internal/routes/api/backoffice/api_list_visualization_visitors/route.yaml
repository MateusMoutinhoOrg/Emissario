body:
    content-type: application/json
    json-schema:
        properties:
            bots:
                type: boolean
            browser:
                type: string
            country:
                type: string
            device:
                type: string
            from:
                type: string
            ip:
                type: string
            limit:
                type: integer
            os:
                type: string
            page:
                type: integer
            path:
                type: string
            prefix:
                type: string
            sort:
                enum:
                    - views
                    - last
                type: string
            status:
                type: integer
            to:
                type: string
        type: object
    max-bytes: 1048576
    type: json
category: Visualization API
description: Open to every backoffice user. Answers {visitors, total, page, pages, limit}, each visitor {ip, country, device, browser, os, views, pages, first_at, last_at}, the ip masked to a viewer.
examples:
    - 'curl -X POST localhost:3000/api/admin/list-visualization-visitors -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"sort":"last","page":1}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminListVisualizationVisitors
      start: 0
      trigger:
        type: equal
        value: /api/admin/list-visualization-visitors
priority: 100
private: true
response-type: application/json
summary: Lists every ip that viewed the public website in a period, paginated, masked to a viewer
