body:
    content-type: application/json
    json-schema:
        properties:
            from:
                maxLength: 16
                type: string
            limit:
                maximum: 100
                minimum: 1
                type: integer
            page:
                minimum: 1
                type: integer
            q:
                maxLength: 200
                type: string
            to:
                maxLength: 16
                type: string
        type: object
    max-bytes: 65536
    type: json
category: Agent API
description: 'Root and viewer. Answers {summaries: [{id, at, preview, messages, input_tokens, output_tokens}], from, to, total, page, pages, limit}; from and to are YYYY-MM-DD, both included, the last 30 days by default, 366 days at most; q is a text the summary or its id holds. 400 for a bad period.'
examples:
    - 'curl -X POST localhost:3000/api/admin/list-agent-summaries -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"from":"2026-10-01","to":"2026-10-14","q":"refund","page":1,"limit":20}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminListAgentSummaries
      start: 0
      trigger:
        type: equal
        value: /api/admin/list-agent-summaries
priority: 100
private: true
response-type: application/json
summary: Answers one page of the summaries of a period, newest first, searched by text
