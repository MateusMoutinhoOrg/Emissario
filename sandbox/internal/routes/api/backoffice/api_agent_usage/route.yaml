body:
    content-type: application/json
    json-schema:
        properties:
            from:
                maxLength: 16
                type: string
            to:
                maxLength: 16
                type: string
        type: object
    max-bytes: 65536
    type: json
category: Agent API
description: 'Root and viewer; a viewer reads every ip masked. Answers {from, to, total, today: {day, total, daily_limit, ip_daily_limit, percent}, days: [{day, input_tokens, output_tokens, total, messages, summaries}], ips: [{ip, calls, input_tokens, output_tokens, total, at_limit}], at_limit: [{ip, total}]}; a limit of 0 is no limit, an IPv6 ip counts by its /64 and summaries hold no ip. 400 for a bad period.'
examples:
    - 'curl -X POST localhost:3000/api/admin/agent-usage -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"from":"2026-10-01","to":"2026-10-14"}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminAgentUsage
      start: 0
      trigger:
        type: equal
        value: /api/admin/agent-usage
priority: 100
private: true
response-type: application/json
summary: 'Answers the tokens of the agent: today against the limits, by day, by ip and the ips at their limit'
