body:
    content-type: application/json
    json-schema:
        properties:
            bots:
                type: boolean
            browser:
                type: string
            country:
                type: string
            device:
                type: string
            from:
                type: string
            ip:
                type: string
            limit:
                type: integer
            os:
                type: string
            page:
                type: integer
            path:
                type: string
            prefix:
                type: string
            status:
                type: integer
            to:
                type: string
        type: object
    max-bytes: 1048576
    type: json
category: Visualization API
description: Open to every backoffice user. Answers {views, total, page, pages, limit}, newest first, each view {id, at, path, page, status, ip, country, device, browser, os, referrer, user_agent}, the ip masked to a viewer.
examples:
    - 'curl -X POST localhost:3000/api/admin/list-visualization-views -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"status":404,"page":1,"limit":50}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminListVisualizationViews
      start: 0
      trigger:
        type: equal
        value: /api/admin/list-visualization-views
priority: 100
private: true
response-type: application/json
summary: Lists the page views of the public website, newest first, paginated, the ip masked to a viewer
