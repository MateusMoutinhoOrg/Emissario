body:
    content-type: application/json
    json-schema:
        properties:
            id:
                minimum: 1
                type: integer
        required:
            - id
        type: object
    max-bytes: 4096
    required: true
    type: json
category: Privacy API
description: 'Root only, and a reader of the access log to release a hold of its rows. Answers {status: ok}, 404 for an id no hold has.'
