body:
    content-type: application/json
    json-schema:
        properties:
            description:
                maxLength: 1000
                type: string
            headers:
                items:
                    maxLength: 4096
                    type: string
                maxItems: 20
                type: array
            method:
                enum:
                    - GET
                    - POST
                type: string
            name:
                maxLength: 64
                type: string
            url:
                maxLength: 2048
                type: string
        required:
            - description
            - method
            - name
            - url
        type: object
    max-bytes: 65536
    required: true
    type: json
category: Agent API
description: 'Root only. name is a slug, unique; method GET or POST; url a whole http(s) address; headers a list of Name: value. Answers 201 {url}; 400 for a value refused, with the field. Anything the agent can call, any anonymous visitor can call, with these headers.'
examples:
    - 'curl -X POST localhost:3000/api/admin/root/add-agent-url -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"name":"order-status","description":"The status of an order, by its number","method":"GET","url":"https://api.example.com/orders","headers":["Authorization: Bearer abc"]}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootAddAgentUrl
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/add-agent-url
priority: 100
private: true
response-type: application/json
summary: Adds a url the public agent can call
