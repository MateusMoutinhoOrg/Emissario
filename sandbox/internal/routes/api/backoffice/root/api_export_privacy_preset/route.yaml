    json-schema:
        properties:
            preset:
                maxLength: 64
                type: string
        required:
            - preset
        type: object
    max-bytes: 4096
    required: true
    type: json
category: Privacy API
description: 'Root only. {preset}: answers the preset document {format, id, version, name, description, jurisdictions, values: {<setting>: {value, reference}}, checklist: [{id, text, reference, when}], changes}.'
