body:
    content-type: application/json
    json-schema:
        properties:
            from:
                maxLength: 128
                type: string
            ip:
                maxLength: 128
                type: string
            kind:
                maxLength: 128
                type: string
            limit:
                maximum: 500
                minimum: 1
                type: integer
            page:
                minimum: 1
                type: integer
            to:
                maxLength: 128
                type: string
        type: object
    max-bytes: 4096
    required: true
    type: json
category: Privacy API
description: 'Root readers only, with two-factor sign-in while it is required, and a token made after it was turned on: {rows: [{id, at, at_utc, at_local, time_zone, ip, port, kind, ref}], total, page, pages, limit}. The filter is ip (one ip or a CIDR range), from and to (days, the last 7 by default) and kind. Every list is inventoried.'
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootListAccessLog
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/list-access-log
priority: 100
private: true
response-type: application/json
summary: Lists the access log rows a filter keeps, to its readers
