body:
    content-type: application/json
    json-schema:
        properties:
            ids:
                items:
                    type: integer
                type: array
        required:
            - ids
        type: object
    max-bytes: 16384
    required: true
    type: json
category: Privacy API
description: 'Root only. ids are the roots who read the access log from now on, and no one else; a viewer''s id answers 400. Answers {readers: [{id, username, totp}]}.'
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootSetAccessLogReaders
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/set-access-log-readers
priority: 100
private: true
response-type: application/json
summary: Names the roots who read the access log
