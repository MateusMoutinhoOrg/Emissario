category: Privacy API
description: Root only. Replaces the IP key with a new random one; the hashes kept stop matching. It cannot be undone. Answers {ip_key_made_at}.
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootRotatePrivacyIpKey
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/rotate-privacy-ip-key
priority: 100
private: true
response-type: application/json
summary: Replaces the key the IPs are hashed under with a new random one
