body:
    content-type: application/json
    json-schema:
        properties:
            before:
                maxLength: 16
                type: string
            ids:
                items:
                    maxLength: 64
                    type: string
                maxItems: 100
                type: array
        type: object
    max-bytes: 65536
    required: true
    type: json
category: Contact Requests API
description: Root only. Send ids — at most 100 — or before — YYYY-MM-DD, every contact request before that day — not both. Answers {removed}; 404 when no id is found, 400 otherwise refused.
examples:
    - 'curl -X POST localhost:3000/api/admin/root/remove-contact-requests -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"before":"2026-07-01"}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootRemoveContactRequests
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/remove-contact-requests
priority: 100
private: true
response-type: application/json
summary: Deletes contact requests, or every one before a date
