body:
    content-type: application/json
    json-schema:
        properties:
            enabled:
                type: boolean
            ignored_ips:
                items:
                    type: string
                maxItems: 100
                type: array
            retention_days:
                maximum: 3650
                minimum: 0
                type: integer
        required:
            - enabled
            - ignored_ips
            - retention_days
        type: object
    max-bytes: 1048576
    required: true
    type: json
category: Visualization API
description: Root only. retention_days 0 keeps the views forever; ignored_ips holds ips and CIDR ranges, 100 at most. Answers {settings}.
examples:
    - 'curl -X POST localhost:3000/api/admin/root/set-visualization-settings -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"enabled":true,"retention_days":90,"ignored_ips":["203.0.113.7"]}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootSetVisualizationSettings
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/set-visualization-settings
priority: 100
private: true
response-type: application/json
summary: 'Sets the settings of the visualization: tracking on or off, the retention in days and the ignored ips'
