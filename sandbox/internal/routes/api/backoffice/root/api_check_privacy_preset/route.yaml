category: Privacy API
description: 'Root only, in one call for an operator that watches many servers. Answers {preset, conform, differences: [{setting, preset, current}], encrypted, newer}: preset is "" for none, conform true when every setting still equals it, newer the newest version of it when there is one, null otherwise.'
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminRootCheckPrivacyPreset
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/check-privacy-preset
priority: 100
private: true
response-type: application/json
summary: Answers whether this server still follows its privacy preset
